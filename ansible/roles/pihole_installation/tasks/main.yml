---
# tasks file for ansible/roles/pihole_installation
- name: Check if dnsmasq exists
  ansible.builtin.service_facts:

- name: Create directories for Pi-Hole
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ~/pihole/etc-pihole
    - ~/pihole/etc-dnsmasq.d

