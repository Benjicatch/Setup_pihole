---
# tasks file for ansible/roles/pihole_setup
- name: Authenticate to Pi-hole API
  ansible.builtin.uri:
    url: "http://localhost:80/api/auth"
    method: POST
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      password: "{{ pihole_password }}"
    return_content: true
  register: pihole_auth

- name: Add blocklist
  ansible.builtin.uri:
    url: "http://localhost:80/api/lists?type=block"
    method: POST
    headers:
      sid: "{{ pihole_auth.json.session.sid }}"
    body_format: json
    body:
      address: "{{ block_lists }}"
      enabled: true
    status_code: [200, 201, 400]

- name: Install blocklists
  ansible.builtin.uri:
    url: "http://localhost:80/api/action/gravity"
    method: POST
    headers:
      sid: "{{ pihole_auth.json.session.sid }}"
